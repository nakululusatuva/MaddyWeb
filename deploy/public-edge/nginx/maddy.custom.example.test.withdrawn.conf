# Emergency withdrawn edge for rollback to an unauthenticated release.
# Keep ACME reachable, but never proxy a request to MaddyWeb.
# The existing mail.custom.example.test server remains the HTTP default server.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name maddy.custom.example.test;

    include /etc/custom-acme/maddyweb/cloudflare-realip.conf;
    if ($maddyweb_cloudflare_peer = 0) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/maddyweb-web-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name maddy.custom.example.test;

    include /etc/custom-acme/maddyweb/cloudflare-realip.conf;
    if ($maddyweb_cloudflare_peer = 0) {
        return 444;
    }

    ssl_certificate /var/lib/maddyweb-web-cert/config/live/maddy.custom.example.test/fullchain.pem;
    ssl_certificate_key /var/lib/maddyweb-web-cert/config/live/maddy.custom.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MaddyWebCustomTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 503;
}
