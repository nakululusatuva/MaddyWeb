# Temporary HTTP-only bootstrap for the maddy.custom.example.test Web certificate.
# Replace this entire managed include with maddy.custom.example.test.conf immediately
# after the dedicated Web certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name maddy.custom.example.test;

    include /etc/custom-acme/maddyweb/cloudflare-realip.conf;
    if ($maddyweb_cloudflare_peer = 0) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/maddyweb-web-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
