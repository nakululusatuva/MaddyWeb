# Managed MaddyWeb public edge for mail_standalone.
# This file is an HTTP-context include; it does not replace nginx.conf.
server {
    listen 80;
    listen [::]:80;
    server_name maddy.standalone.example.test;

    include /etc/nginx/maddyweb/cloudflare-realip.conf;
    if ($maddyweb_cloudflare_peer = 0) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/maddyweb-web-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://maddy.standalone.example.test$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name maddy.standalone.example.test;

    include /etc/nginx/maddyweb/cloudflare-realip.conf;
    if ($maddyweb_cloudflare_peer = 0) {
        return 444;
    }

    ssl_certificate /var/lib/maddyweb-web-cert/config/live/maddy.standalone.example.test/fullchain.pem;
    ssl_certificate_key /var/lib/maddyweb-web-cert/config/live/maddy.standalone.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MaddyWebStandaloneTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 128k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host maddy.standalone.example.test;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /healthz {
        return 404;
    }

    location = /login {
        limit_req zone=maddyweb_login_surface burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /static/login.css {
        limit_req zone=maddyweb_login_surface burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /static/login.js {
        limit_req zone=maddyweb_login_surface burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/csrf {
        limit_req zone=maddyweb_auth_csrf burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/passkey/options {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/passkey {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/password {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/totp {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/recovery {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/enrollment {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/enrollment/confirm {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/password/change {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/recovery-codes/regenerate {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/step-up {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/passkey/step-up/options {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/auth/passkey/step-up {
        limit_req zone=maddyweb_auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/send {
        client_max_body_size 32m;
        proxy_request_buffering off;
        limit_req zone=maddyweb_send burst=2 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/me/send {
        client_max_body_size 32m;
        proxy_request_buffering off;
        limit_req zone=maddyweb_send burst=2 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/admin/send {
        client_max_body_size 32m;
        proxy_request_buffering off;
        limit_req zone=maddyweb_send burst=2 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/me/mail-events {
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        limit_req zone=maddyweb_general burst=20 nodelay;
        limit_conn maddyweb_mail_events 2;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /api/v1/admin/mail-events {
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        limit_req zone=maddyweb_general burst=20 nodelay;
        limit_conn maddyweb_mail_events 2;
        proxy_pass http://127.0.0.1:8787;
    }

    location / {
        limit_req zone=maddyweb_general burst=100 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
}
