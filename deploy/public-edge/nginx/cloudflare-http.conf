# MaddyWeb public-edge HTTP-context directives.
#
# Include this file exactly once inside the nginx "http" block. The networks
# are pinned from Cloudflare's official lists as verified on 2026-07-25:
# https://www.cloudflare.com/ips-v4
# https://www.cloudflare.com/ips-v6
#
# $realip_remote_addr retains the TCP peer after ngx_http_realip_module
# replaces $remote_addr with the authenticated Cloudflare visitor address.
geo $realip_remote_addr $maddyweb_cloudflare_peer {
    default 0;

    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# $binary_remote_addr is the visitor address only after a trusted Cloudflare
# peer has supplied CF-Connecting-IP. Direct clients cannot rewrite it.
limit_req_zone $binary_remote_addr zone=maddyweb_auth_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=maddyweb_auth_csrf:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=maddyweb_login_surface:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=maddyweb_general:1m rate=300r/m;
limit_req_zone $binary_remote_addr zone=maddyweb_send:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=maddyweb_mail_events:1m;
limit_req_status 429;
limit_conn_status 429;
