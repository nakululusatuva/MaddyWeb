name: Browser security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install browser test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[browser]'
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Run browser security tests
        id: browser_tests
        run: python -m pytest -q tests/browser --junitxml=browser-results.xml
      - name: Surface browser test failures
        if: ${{ failure() && steps.browser_tests.outcome == 'failure' }}
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("browser-results.xml")
          if not report.is_file():
              print("::error title=Browser test failure::The test report was not created.")
              raise SystemExit(0)

          def escape(value: str) -> str:
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          failures = 0
          for case in ET.parse(report).getroot().iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              failures += 1
              test_id = f"{case.get('classname', '')}.{case.get('name', '')}".strip(".")
              detail = "\n".join(
                  part for part in (problem.get("message", ""), problem.text or "") if part
              )
              message = f"{test_id}\n{detail}"[:4000]
              print(f"::error title=Browser test failure::{escape(message)}")

          if failures == 0:
              print("::error title=Browser test failure::No failing test case was recorded.")
